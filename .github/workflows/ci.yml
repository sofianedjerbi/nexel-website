# Lint, the pages and their links, and commit messages, on every pull request and every push to main.
# Not blocking yet (continue-on-error, see the step names): ruff format and the ruff rules today's code
# breaks (the `ignore` list in ruff.toml). GitHub Pages serves main as it is: this is the deploy check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF: ruff@0.17.6

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: ruff check (blocking; the rules in ruff.toml)
        run: uvx "$RUFF" check --output-format github .
      - name: ruff check, all the families' rules (not blocking; the debt)
        continue-on-error: true
        run: |
          # --select on the command line re-enables the rules ruff.toml ignores (keep it the same list)
          uvx "$RUFF" check --select E,W,F,B,UP,SIM,I,C4,RUF,PIE,ASYNC --statistics . | tee ruff-debt.txt
          echo "ruff debt: $(tail -n 1 ruff-debt.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: ruff format --check (not blocking until the format pass)
        continue-on-error: true
        run: |
          uvx "$RUFF" format --check . > ruff-format.txt || { echo "ruff format: $(tail -n 1 ruff-format.txt)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

  pages:
    name: Pages (make_site.py, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
      - name: tools/make_site.py runs, and the committed pages are what it writes
        run: |
          uv run --no-project python tools/make_site.py
          git diff --exit-code -- index.html devlog \
            || { echo "::error::the pages are not the ones make_site.py writes: run it and commit"; exit 1; }
      - name: Every local link and picture is there
        run: uv run --no-project python tools/check_links.py

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock @commitlint/cli@21 @commitlint/config-conventional@21
      - name: commitlint (the pull request's commits, or the pushed range)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            npx commitlint --from "$BASE" --to "$HEAD" --verbose
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            npx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            # a new branch or a force-push: no old head to start from, the last commit only
            npx commitlint --last --verbose
          fi
