# SAST: CodeQL (Python: tools/; JavaScript: the pages and play/brain/; the game is scanned in its own repo), gitleaks over the whole
# history, bandit on tools/ (medium and up; not blocking, the count goes in the run's summary). No dependencies to audit.
name: Security

on:
  pull_request:
  push:
    branches: [main]          # CodeQL compares a pull request with main's last analysis
  schedule:
    - cron: "27 5 * * 1"      # Mondays 05:27 UTC: new advisories for unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: SAST (bandit, medium+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: bandit -r tools -ll (not blocking while it has findings; the count is in the summary)
        continue-on-error: true
        run: |
          uvx bandit@1.9.4 -r tools -ll -q -f json -o bandit.json || true
          n=$(python3 -c "import json; print(len(json.load(open('bandit.json'))['results']))")
          echo "bandit: $n medium/high findings in tools/" >> "$GITHUB_STEP_SUMMARY"
          uvx bandit@1.9.4 -r tools -ll
