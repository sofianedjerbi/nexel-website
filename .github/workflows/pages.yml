# The site, deployed: these pages, and under play/ the game as its own repo builds it from source (sofianedjerbi/
# nexel-worlds, its game.yml: the artifact "game" of its latest good run on main). play/brain/ is this repo's.
# On every push here; every half hour it looks for a newer game and deploys only when there is one.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GAME_REPO: sofianedjerbi/nexel-worlds
  SITE: https://sofianedjerbi.github.io/nexel-website

jobs:
  build:
    name: Assemble the site and the game
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.game.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - name: The game's latest build
        id: game
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          run=$(gh run list -R "$GAME_REPO" -w game.yml -b main -s success -L 1 --json databaseId,headSha -q '.[0]')
          [ -n "$run" ] || { echo "::error::no good build of the game yet ($GAME_REPO, game.yml)"; exit 1; }
          id=$(echo "$run" | jq -r .databaseId); sha=$(echo "$run" | jq -r .headSha | cut -c1-7)
          live=$(curl -fsS "$SITE/play/BUILD" 2>/dev/null || true)
          if [ "$EVENT" = schedule ] && [ "$live" = "$sha" ]; then
            echo "the site already serves the game at $sha"; echo "deploy=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "deploy=yes" >> "$GITHUB_OUTPUT"
          echo "run=$id" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: The site, with the game in play/
        if: steps.game.outputs.deploy == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site && git archive HEAD | tar -x -C _site
          gh run download "${{ steps.game.outputs.run }}" -R "$GAME_REPO" -n game -D _site/play
          echo "${{ steps.game.outputs.sha }}" > _site/play/BUILD
          python3 tools/check_links.py _site
      - if: steps.game.outputs.deploy == 'yes'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.deploy == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5.0.1
